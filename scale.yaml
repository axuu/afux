# ESPHome 配置示例：ESP32 读取 AFU 体脂秤并上报 Home Assistant
#
# 使用方式：
#   1. 复制 secrets.example.yaml 为 secrets.yaml 并填写真实值
#   2. 将本仓库的 components/ 目录放到 ESPHome 配置目录（或通过 external_components 引用）
#   3. esphome run scale.yaml

esphome:
  name: body-scale
  friendly_name: 体脂秤

# 引用本仓库的自定义组件
# ⚠️ 关键：`type: local` 的 `path` 是相对于【本配置文件所在目录】解析的。
# 请把本仓库的 `components/` 文件夹放到与 scale.yaml 相同的目录下，例如：
#
#   /config/esphome/
#   ├── scale.yaml
#   └── components/
#       └── afu_scale/
#
# 若 components 目录在别处，请改用绝对路径，例如：
#   path: /config/components
external_components:
  - source:
      type: local
      path: components

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

logger:
  level: DEBUG

# 蓝牙跟踪：负责广播监听（免连接读取体重）与 GATT 连接
esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 160ms
    active: true

# BLE 客户端：连接本体脂秤，发送握手包并订阅 FFB2 通知
ble_client:
  - mac_address: !secret scale_mac_address
    id: scale_client

sensor:
  - platform: afu_scale
    ble_client_id: scale_client
    name: "体重"
    id: scale_weight
    unit_of_measurement: kg
    accuracy_decimals: 2
    device_class: weight
    force_update: true
    # 稳定标志出现且重量持续不变后，每次上秤只发布一次。
    settle_time: 2s
    # 协议中的原始 16 位值，未确认缩放关系，因此不标 Ω。
    impedance_raw:
      name: "原始阻抗"
      id: scale_impedance_raw
      accuracy_decimals: 0
      force_update: true
