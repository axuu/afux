services:
  scale-api:
    build: .
    restart: unless-stopped
    init: true
    expose:
      - "8080"
    environment:
      API_TOKEN: "${API_TOKEN:?Set API_TOKEN}"
      PROFILE_NICKNAME: "${PROFILE_NICKNAME:?Set PROFILE_NICKNAME}"
      PROFILE_HEIGHT_CM: "${PROFILE_HEIGHT_CM:?Set PROFILE_HEIGHT_CM}"
      PROFILE_BIRTH_YEAR: "${PROFILE_BIRTH_YEAR:?Set PROFILE_BIRTH_YEAR}"
      PROFILE_BIRTH_MONTH: "${PROFILE_BIRTH_MONTH:?Set PROFILE_BIRTH_MONTH}"
      PROFILE_SEX: "${PROFILE_SEX:?Set PROFILE_SEX}"
    volumes:
      - scale-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: "0.50"
    pids_limit: 64
    labels:
      - "traefik.http.middlewares.afux-rate-limit.ratelimit.average=60"
      - "traefik.http.middlewares.afux-rate-limit.ratelimit.period=1m"
      - "traefik.http.middlewares.afux-rate-limit.ratelimit.burst=20"
      - "coolify.traefik.middlewares=afux-rate-limit"

volumes:
  scale-data:
