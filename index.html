<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Afux 体重记录</title>
  <style>
    :root {
      --mist: #e8f0f0;
      --paper: #f8fbfa;
      --ink: #173238;
      --muted: #668085;
      --line: #cbdcdb;
      --teal: #176f77;
      --aqua: #72c1c4;
      --coral: #d96955;
      --fat: #b84e3f;
      --shadow: 0 18px 60px rgba(31, 67, 72, 0.12);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 0%, rgba(114, 193, 196, 0.25), transparent 32rem),
        var(--mist);
      color: var(--ink);
      font-family: "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    }

    button { font: inherit; }

    .shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    h1, h2, p { margin: 0; }

    h1 {
      font-size: clamp(21px, 3vw, 29px);
      font-weight: 650;
      letter-spacing: -0.04em;
    }

    .eyebrow, .label, th, footer {
      color: var(--muted);
      font: 600 11px/1.4 ui-monospace, "SFMono-Regular", Consolas, monospace;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .refresh {
      min-height: 42px;
      padding: 0 18px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .refresh:hover { background: var(--ink); color: white; transform: translateY(-1px); }
    .refresh:focus-visible { outline: 3px solid var(--aqua); outline-offset: 3px; }
    .refresh:disabled { cursor: wait; opacity: 0.55; transform: none; }

    .dashboard {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
      gap: 20px;
    }

    .panel {
      overflow: hidden;
      border: 1px solid rgba(23, 50, 56, 0.12);
      border-radius: 24px;
      background: rgba(248, 251, 250, 0.9);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .readout {
      position: relative;
      min-height: 390px;
      padding: clamp(24px, 5vw, 48px);
      background: var(--ink);
      color: white;
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      color: rgba(255, 255, 255, 0.62);
      font-size: 13px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .status::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--aqua);
      box-shadow: 0 0 0 5px rgba(114, 193, 196, 0.14);
      content: "";
    }

    .status.error::before { background: var(--coral); box-shadow: 0 0 0 5px rgba(217, 105, 85, 0.16); }

    .weight {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 60px 0 26px;
      font-variant-numeric: tabular-nums;
    }

    .weight strong {
      font: 300 clamp(76px, 13vw, 132px)/0.8 ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
      letter-spacing: -0.075em;
    }

    .weight span { color: var(--aqua); font-size: 18px; font-weight: 650; }

    .ruler {
      position: relative;
      height: 38px;
      margin: 0 -48px 38px;
      background: repeating-linear-gradient(
        90deg,
        transparent 0 19px,
        rgba(255, 255, 255, 0.24) 19px 20px
      );
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
    }

    .ruler::before {
      position: absolute;
      left: 50%;
      bottom: -1px;
      width: 2px;
      height: 38px;
      background: var(--coral);
      content: "";
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin: 0;
    }

    .facts div { min-width: 0; }
    .facts dt { margin-bottom: 7px; color: rgba(255, 255, 255, 0.5); font-size: 12px; }
    .facts dd { margin: 0; overflow: hidden; font-size: 17px; text-overflow: ellipsis; white-space: nowrap; }
    .facts dd.data { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }

    .right-column { display: grid; gap: 20px; }

    .panel-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      padding: 24px 26px 0;
    }

    .panel-heading h2 { margin-top: 5px; font-size: 20px; letter-spacing: -0.035em; }
    .panel-heading output { color: var(--teal); font-weight: 650; }

    .chart-legend { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px 14px; font-size: 12px; }
    .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend-line { width: 20px; border-top: 3px solid var(--teal); }
    .legend-line.fat { border-color: var(--fat); border-top-style: dashed; }
    .weight-key { color: var(--teal); }
    .fat-key { color: var(--fat); }

    .chart-wrap { position: relative; min-height: 220px; padding: 18px 20px 20px; }
    #chart { display: block; width: 100%; height: 210px; overflow: visible; }
    .grid-line { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 6; }
    .grid-label { fill: var(--muted); font: 11px ui-monospace, "SFMono-Regular", Consolas, monospace; }
    .weight-axis { fill: var(--teal); }
    .fat-axis { fill: var(--fat); }
    .trend-line { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .weight-line, .weight-dot { stroke: var(--teal); }
    .fat-line, .fat-dot { stroke: var(--fat); }
    .fat-line { stroke-dasharray: 0.025 0.015; }
    .trend-dot { fill: var(--paper); stroke-width: 3; }

    .empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 30px;
      color: var(--muted);
      text-align: center;
    }

    .weekly, .activity { grid-column: 1 / -1; }
    .weekly-body { padding: 18px 26px 24px; }
    .week-summary { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 18px; }
    .week-summary strong { color: var(--teal); font: 400 38px/1.2 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
    .week-summary span { color: var(--muted); font-size: 13px; }
    .weekly-list { display: flex; min-width: 0; overflow-x: auto; gap: 0; margin: 22px 0 0; padding: 16px 0 0; border-top: 1px solid var(--line); list-style: none; }
    .weekly-list li { flex: 1 0 96px; padding: 0 12px; border-left: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    .weekly-list li:first-child { padding-left: 0; border-left: 0; }
    .weekly-list time, .weekly-list small { display: block; color: var(--muted); font-size: 12px; }
    .weekly-list strong { display: block; margin: 5px 0 3px; font-size: 17px; font-weight: 650; }
    .weekly-list .current strong { color: var(--teal); }

    .activity-body { padding: 22px 26px 28px; }
    .activity-scroll { overflow-x: auto; padding-bottom: 4px; }
    .activity-grid { display: flex; width: max-content; gap: 4px; padding-bottom: 27px; }
    .activity-week { position: relative; display: grid; grid-template-rows: repeat(7, 12px); gap: 4px; }
    .activity-day, .legend-square { width: 12px; height: 12px; border-radius: 3px; background: rgba(23, 111, 119, 0.11); }
    .activity-day.recorded, .legend-square.recorded { background: var(--teal); }
    .activity-day.future { border: 1px solid var(--line); background: transparent; }
    .month-label { position: absolute; top: 115px; left: 0; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .activity-legend { display: flex; gap: 16px; align-items: center; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .activity-legend span { display: inline-flex; align-items: center; gap: 6px; }

    .history { grid-column: 1 / -1; }
    .table-wrap { overflow-x: auto; padding: 12px 14px 18px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 15px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
    th:nth-child(n+2), td:nth-child(n+2) { text-align: right; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: rgba(114, 193, 196, 0.08); }
    td.data { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-variant-numeric: tabular-nums; }
    td.weight-cell { color: var(--teal); font-size: 16px; font-weight: 700; }

    footer {
      padding: 18px 4px 0;
      text-align: right;
    }

    @media (max-width: 800px) {
      .shell { width: min(100% - 20px, 680px); padding-top: 20px; }
      .dashboard { grid-template-columns: 1fr; }
      .readout { min-height: 350px; padding: 26px; }
      .weight { margin-top: 54px; }
      .ruler { margin-inline: -26px; }
      .weekly, .activity, .history { grid-column: auto; }
    }

    @media (max-width: 520px) {
      .refresh { padding-inline: 14px; }
      .activity .panel-heading { align-items: start; flex-direction: column; gap: 7px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .weight-line { animation: reveal 700ms ease-out both; stroke-dasharray: 1; stroke-dashoffset: 1; }
      .fat-line { animation: fade 500ms ease-out both; }
      @keyframes reveal { to { stroke-dashoffset: 0; } }
      @keyframes fade { from { opacity: 0; } }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <h1>Afux 体重记录</h1>
      <button class="refresh" id="refresh" type="button">刷新数据</button>
    </header>

    <div class="dashboard">
      <section class="panel readout" aria-labelledby="latest-title">
        <div class="status-line">
          <span class="status" id="status" aria-live="polite">正在读取</span>
          <time id="latest-time">—</time>
        </div>
        <p class="eyebrow" id="latest-title" style="margin-top: 30px; color: rgba(255,255,255,.5)">最近一次</p>
        <div class="weight"><strong id="latest-weight">--.--</strong><span>kg</span></div>
        <div class="ruler" aria-hidden="true"></div>
        <dl class="facts">
          <div><dt>较上次</dt><dd class="data" id="latest-delta">—</dd></div>
          <div><dt>累计记录</dt><dd class="data" id="latest-count">—</dd></div>
        </dl>
      </section>

      <div class="right-column">
        <section class="panel" aria-labelledby="trend-title">
          <div class="panel-heading">
            <div><p class="label">Last 30 readings</p><h2 id="trend-title">体重与体脂趋势</h2></div>
            <div class="chart-legend">
              <span class="weight-key"><i class="legend-line" aria-hidden="true"></i>体重</span>
              <span class="fat-key"><i class="legend-line fat" aria-hidden="true"></i>估算体脂率</span>
            </div>
          </div>
          <div class="chart-wrap">
            <svg id="chart" viewBox="0 0 720 210" role="img" aria-label="最近 30 次体重与估算体脂率趋势"></svg>
            <p class="empty" id="chart-empty">完成第一次称重后，趋势会显示在这里。</p>
          </div>
        </section>
      </div>

      <section class="panel weekly" aria-labelledby="weekly-title">
        <div class="panel-heading">
          <div><p class="label">Weekly average</p><h2 id="weekly-title">7 日平均体重</h2></div>
          <output id="week-count">本周 0/7 天</output>
        </div>
        <div class="weekly-body">
          <div class="week-summary"><strong id="week-average">—</strong><span id="week-change">周一至周日 · 按有记录的日期平均</span></div>
          <ol class="weekly-list" id="weekly-list" aria-label="最近 8 个自然周的平均体重"></ol>
        </div>
      </section>

      <section class="panel activity" aria-labelledby="activity-title">
        <div class="panel-heading">
          <div><p class="label">Daily activity</p><h2 id="activity-title">称重日历</h2></div>
          <output id="activity-total">最近 53 周</output>
        </div>
        <div class="activity-body">
          <div class="activity-scroll"><div class="activity-grid" id="activity-grid" aria-hidden="true"></div></div>
          <div class="activity-legend"><span><i class="legend-square recorded" aria-hidden="true"></i>有记录</span><span><i class="legend-square" aria-hidden="true"></i>无记录</span></div>
        </div>
      </section>

      <section class="panel history" aria-labelledby="history-title">
        <div class="panel-heading">
          <div><p class="label">Measurement history</p><h2 id="history-title">体重记录</h2></div>
          <output id="total">0 条</output>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>测量时间</th><th>体重</th><th>较上次</th><th>BMI</th><th>估算体脂率</th></tr></thead>
            <tbody id="history-body"></tbody>
          </table>
        </div>
      </section>
    </div>

    <footer><span id="updated">尚未刷新</span></footer>
  </main>

  <script>
    const elements = Object.fromEntries([
      "refresh", "status", "latest-time", "latest-weight", "latest-delta",
      "latest-count", "chart", "chart-empty", "week-average", "week-count",
      "week-change", "weekly-list", "activity-grid", "activity-total",
      "total", "history-body", "updated"
    ].map(id => [id, document.getElementById(id)]));

    const formatTime = value => new Intl.DateTimeFormat("zh-CN", {
      month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
    }).format(new Date(value));

    function renderLatest(rows, total) {
      if (!rows.length) return;
      const latest = rows[0];
      elements["latest-weight"].textContent = (latest.weight_g / 1000).toFixed(2);
      elements["latest-count"].textContent = `${total} 次`;
      elements["latest-time"].textContent = formatTime(latest.measured_at);
      if (rows.length > 1) {
        const delta = (latest.weight_g - rows[1].weight_g) / 1000;
        elements["latest-delta"].textContent = `${delta > 0 ? "+" : ""}${delta.toFixed(2)} kg`;
      }
    }

    function renderChart(rows) {
      const measurements = rows.slice(0, 30).reverse();
      const weights = measurements.map(row => row.weight_g / 1000);
      const bodyFat = measurements.map(row => row.body_fat_pct_estimate);
      const bodyFatValues = bodyFat.filter(value => value !== null);
      const svg = elements.chart;
      svg.replaceChildren();
      elements["chart-empty"].hidden = weights.length > 0;
      if (!weights.length) return;

      const width = 720, height = 210, left = 48, right = 48, top = 18, bottom = 30;
      const paddedRange = values => {
        const min = Math.min(...values), max = Math.max(...values);
        const padding = Math.max((max - min) * 0.2, 0.25);
        return [min - padding, max + padding];
      };
      const [weightMin, weightMax] = paddedRange(weights);
      const [fatMin, fatMax] = bodyFatValues.length ? paddedRange(bodyFatValues) : [0, 1];
      const x = index => left + (weights.length === 1 ? (width - left - right) / 2 : index * (width - left - right) / (weights.length - 1));
      const y = (value, min, max) => top + (max - value) * (height - top - bottom) / (max - min);
      const ns = "http://www.w3.org/2000/svg";

      const appendLabel = (x, y, text, anchor, className) => {
        const label = document.createElementNS(ns, "text");
        label.setAttribute("x", x); label.setAttribute("y", y);
        label.setAttribute("text-anchor", anchor); label.setAttribute("class", `grid-label ${className}`);
        label.textContent = text;
        svg.append(label);
      };

      for (let index = 0; index < 3; index += 1) {
        const lineY = top + index * (height - top - bottom) / 2;
        const line = document.createElementNS(ns, "line");
        line.setAttribute("x1", left); line.setAttribute("x2", width - right);
        line.setAttribute("y1", lineY); line.setAttribute("y2", lineY);
        line.setAttribute("class", "grid-line");
        svg.append(line);
        appendLabel(0, lineY + 4, (weightMax - index * (weightMax - weightMin) / 2).toFixed(1), "start", "weight-axis");
        if (bodyFatValues.length) {
          appendLabel(width, lineY + 4, `${(fatMax - index * (fatMax - fatMin) / 2).toFixed(1)}%`, "end", "fat-axis");
        }
      }

      const appendSeries = (values, min, max, className) => {
        const points = values.map((value, index) => value === null ? null : [x(index), y(value, min, max)]).filter(Boolean);
        if (!points.length) return;
        const path = document.createElementNS(ns, "path");
        path.setAttribute("d", points.map((point, index) => `${index ? "L" : "M"}${point}`).join(" "));
        path.setAttribute("class", `trend-line ${className}-line`);
        path.setAttribute("pathLength", "1");
        svg.append(path);
        const dot = document.createElementNS(ns, "circle");
        dot.setAttribute("cx", points[points.length - 1][0]); dot.setAttribute("cy", points[points.length - 1][1]);
        dot.setAttribute("r", 5); dot.setAttribute("class", `trend-dot ${className}-dot`);
        svg.append(dot);
      };

      appendSeries(weights, weightMin, weightMax, "weight");
      appendSeries(bodyFat, fatMin, fatMax, "fat");
    }

    function buildWeightCalendar(measurements, today = new Date()) {
      const end = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      const start = new Date(end);
      start.setDate(end.getDate() - (end.getDay() + 6) % 7 - 52 * 7);
      const daily = new Map();
      for (const row of measurements) {
        const measured = new Date(row.measured_at);
        const day = new Date(measured.getFullYear(), measured.getMonth(), measured.getDate());
        if (day < start || day > end) continue;
        const entry = daily.get(day.getTime()) || {sum: 0, count: 0};
        entry.sum += row.weight_g;
        entry.count += 1;
        daily.set(day.getTime(), entry);
      }
      return Array.from({length: 53}, (_, index) => {
        const monday = new Date(start);
        monday.setDate(start.getDate() + index * 7);
        const days = Array.from({length: 7}, (_, offset) => {
          const date = new Date(monday);
          date.setDate(monday.getDate() + offset);
          const entry = daily.get(date.getTime());
          return {date, future: date > end, average_g: entry ? entry.sum / entry.count : null};
        });
        const recorded = days.filter(day => day.average_g !== null);
        return {
          monday, days, count: recorded.length,
          average_g: recorded.length ? recorded.reduce((sum, day) => sum + day.average_g, 0) / recorded.length : null
        };
      });
    }

    function renderWeightCalendar(measurements) {
      const weeks = buildWeightCalendar(measurements);
      const current = weeks.at(-1), previous = weeks.at(-2);
      const formatWeight = grams => grams === null ? "—" : `${(grams / 1000).toFixed(2)} kg`;
      const dateKey = date => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      elements["week-average"].textContent = formatWeight(current.average_g);
      elements["week-count"].textContent = `本周 ${current.count}/7 天`;
      const delta = current.average_g !== null && previous.average_g !== null
        ? `${(current.average_g - previous.average_g) >= 0 ? "+" : ""}${((current.average_g - previous.average_g) / 1000).toFixed(2)} kg`
        : null;
      elements["week-change"].textContent = `${delta ? `较上周 ${delta} · ` : ""}周一至周日 · 按有记录的日期平均`;

      const weeklyList = document.createDocumentFragment();
      for (const [index, week] of weeks.slice(-8).entries()) {
        const item = document.createElement("li");
        if (index === 7) item.classList.add("current");
        const time = document.createElement("time");
        time.dateTime = dateKey(week.monday);
        time.textContent = index === 7 ? "本周" : `${week.monday.getMonth() + 1}/${week.monday.getDate()} 起`;
        const value = document.createElement("strong");
        value.textContent = formatWeight(week.average_g);
        const count = document.createElement("small");
        count.textContent = `${week.count}/7 天`;
        item.append(time, value, count);
        weeklyList.append(item);
      }
      elements["weekly-list"].replaceChildren(weeklyList);

      const activity = document.createDocumentFragment();
      for (const [index, week] of weeks.entries()) {
        const column = document.createElement("div");
        column.className = "activity-week";
        for (const day of week.days) {
          const square = document.createElement("span");
          square.className = `activity-day${day.future ? " future" : day.average_g !== null ? " recorded" : ""}`;
          square.title = `${day.date.toLocaleDateString("zh-CN")} · ${day.future ? "未到日期" : day.average_g === null ? "无记录" : `日均 ${formatWeight(day.average_g)}`}`;
          column.append(square);
        }
        const first = week.days.find(day => day.date.getDate() === 1);
        if (index === 0 || first) {
          const label = document.createElement("span");
          label.className = "month-label";
          label.textContent = `${(first ? first.date : week.monday).getMonth() + 1}月`;
          column.append(label);
        }
        activity.append(column);
      }
      const firstRender = !elements["activity-grid"].childElementCount;
      elements["activity-grid"].replaceChildren(activity);
      if (firstRender) elements["activity-grid"].parentElement.scrollLeft = elements["activity-grid"].parentElement.scrollWidth;
      elements["activity-total"].textContent = `最近 53 周 · 已记录 ${weeks.reduce((sum, week) => sum + week.count, 0)} 天`;
    }

    function renderHistory(rows, total) {
      elements.total.textContent = `${total} 条`;
      const fragment = document.createDocumentFragment();
      for (const [index, row] of rows.entries()) {
        const previous = rows[index + 1];
        const delta = previous ? (row.weight_g - previous.weight_g) / 1000 : null;
        const cells = [
          formatTime(row.measured_at),
          `${(row.weight_g / 1000).toFixed(2)} kg`,
          delta === null ? "—" : `${delta > 0 ? "+" : ""}${delta.toFixed(2)} kg`,
          row.bmi.toFixed(1),
          row.body_fat_pct_estimate === null ? "—" : `${row.body_fat_pct_estimate.toFixed(1)}%`
        ];
        const tr = document.createElement("tr");
        cells.forEach((value, index) => {
          const td = document.createElement("td");
          td.textContent = value;
          if (index > 0) td.classList.add("data");
          if (index === 1) td.classList.add("weight-cell");
          tr.append(td);
        });
        fragment.append(tr);
      }
      elements["history-body"].replaceChildren(fragment);
    }

    async function load() {
      elements.refresh.disabled = true;
      elements.status.textContent = "正在读取";
      elements.status.classList.remove("error");
      try {
        const response = await fetch("/api/measurements?limit=365", {cache: "no-store"});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        renderLatest(data.measurements, data.total);
        renderChart(data.measurements);
        renderWeightCalendar(data.activity_measurements);
        renderHistory(data.measurements, data.total);
        elements.status.textContent = data.measurements.length ? "数据已同步" : "等待第一次称重";
        elements.updated.textContent = `更新于 ${new Date().toLocaleTimeString("zh-CN", {hour: "2-digit", minute: "2-digit"})}`;
      } catch (error) {
        elements.status.textContent = "读取失败，请重试";
        elements.status.classList.add("error");
      } finally {
        elements.refresh.disabled = false;
      }
    }

    elements.refresh.addEventListener("click", load);
    load();
    setInterval(load, 30_000);
  </script>
</body>
</html>
