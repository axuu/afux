<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AFU 称重记录</title>
  <style>
    :root {
      --mist: #e8f0f0;
      --paper: #f8fbfa;
      --ink: #173238;
      --muted: #668085;
      --line: #cbdcdb;
      --teal: #176f77;
      --aqua: #72c1c4;
      --coral: #d96955;
      --shadow: 0 18px 60px rgba(31, 67, 72, 0.12);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 0%, rgba(114, 193, 196, 0.25), transparent 32rem),
        var(--mist);
      color: var(--ink);
      font-family: "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    }

    button { font: inherit; }

    .shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      display: grid;
      width: 52px;
      height: 52px;
      place-items: center;
      border: 1px solid var(--ink);
      border-radius: 50%;
      font: 700 13px/1 ui-monospace, "SFMono-Regular", Consolas, monospace;
      letter-spacing: 0.12em;
    }

    h1, h2, p { margin: 0; }

    h1 {
      font-size: clamp(21px, 3vw, 29px);
      font-weight: 650;
      letter-spacing: -0.04em;
    }

    .eyebrow, .label, th, footer {
      color: var(--muted);
      font: 600 11px/1.4 ui-monospace, "SFMono-Regular", Consolas, monospace;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .refresh {
      min-height: 42px;
      padding: 0 18px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .refresh:hover { background: var(--ink); color: white; transform: translateY(-1px); }
    .refresh:focus-visible { outline: 3px solid var(--aqua); outline-offset: 3px; }
    .refresh:disabled { cursor: wait; opacity: 0.55; transform: none; }

    .dashboard {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
      gap: 20px;
    }

    .panel {
      overflow: hidden;
      border: 1px solid rgba(23, 50, 56, 0.12);
      border-radius: 24px;
      background: rgba(248, 251, 250, 0.9);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .readout {
      position: relative;
      min-height: 390px;
      padding: clamp(24px, 5vw, 48px);
      background: var(--ink);
      color: white;
    }

    .status-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      color: rgba(255, 255, 255, 0.62);
      font-size: 13px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .status::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--aqua);
      box-shadow: 0 0 0 5px rgba(114, 193, 196, 0.14);
      content: "";
    }

    .status.error::before { background: var(--coral); box-shadow: 0 0 0 5px rgba(217, 105, 85, 0.16); }

    .weight {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 60px 0 26px;
      font-variant-numeric: tabular-nums;
    }

    .weight strong {
      font: 300 clamp(76px, 13vw, 132px)/0.8 ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
      letter-spacing: -0.075em;
    }

    .weight span { color: var(--aqua); font-size: 18px; font-weight: 650; }

    .ruler {
      position: relative;
      height: 38px;
      margin: 0 -48px 38px;
      background: repeating-linear-gradient(
        90deg,
        transparent 0 19px,
        rgba(255, 255, 255, 0.24) 19px 20px
      );
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
    }

    .ruler::before {
      position: absolute;
      left: 50%;
      bottom: -1px;
      width: 2px;
      height: 38px;
      background: var(--coral);
      content: "";
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin: 0;
    }

    .facts div { min-width: 0; }
    .facts dt { margin-bottom: 7px; color: rgba(255, 255, 255, 0.5); font-size: 12px; }
    .facts dd { margin: 0; overflow: hidden; font-size: 17px; text-overflow: ellipsis; white-space: nowrap; }
    .facts dd.data { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }

    .right-column { display: grid; gap: 20px; }

    .panel-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      padding: 24px 26px 0;
    }

    .panel-heading h2 { margin-top: 5px; font-size: 20px; letter-spacing: -0.035em; }
    .panel-heading output { color: var(--teal); font-weight: 650; }

    .chart-wrap { position: relative; min-height: 220px; padding: 18px 20px 20px; }
    #chart { display: block; width: 100%; height: 210px; overflow: visible; }
    .grid-line { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 6; }
    .grid-label { fill: var(--muted); font: 11px ui-monospace, "SFMono-Regular", Consolas, monospace; }
    .trend-line { fill: none; stroke: var(--teal); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .trend-dot { fill: var(--paper); stroke: var(--coral); stroke-width: 3; }

    .empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 30px;
      color: var(--muted);
      text-align: center;
    }

    .history { grid-column: 1 / -1; }
    .table-wrap { overflow-x: auto; padding: 12px 14px 18px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 15px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
    th:nth-child(n+2), td:nth-child(n+2) { text-align: right; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: rgba(114, 193, 196, 0.08); }
    td.data { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-variant-numeric: tabular-nums; }
    td.weight-cell { color: var(--teal); font-size: 16px; font-weight: 700; }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 4px 0;
    }

    @media (max-width: 800px) {
      .shell { width: min(100% - 20px, 680px); padding-top: 20px; }
      .dashboard { grid-template-columns: 1fr; }
      .readout { min-height: 350px; padding: 26px; }
      .weight { margin-top: 54px; }
      .ruler { margin-inline: -26px; }
      .history { grid-column: auto; }
    }

    @media (max-width: 520px) {
      .brand-mark { width: 44px; height: 44px; }
      .refresh { padding-inline: 14px; }
      .facts { grid-template-columns: 1fr 1fr; }
      .facts div:last-child { grid-column: 1 / -1; }
      footer { flex-direction: column; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .trend-line { animation: reveal 700ms ease-out both; stroke-dasharray: 1; stroke-dashoffset: 1; }
      @keyframes reveal { to { stroke-dashoffset: 0; } }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">AFU</span>
        <div>
          <p class="eyebrow">Raw measurement log</p>
          <h1>称重记录</h1>
        </div>
      </div>
      <button class="refresh" id="refresh" type="button">刷新数据</button>
    </header>

    <div class="dashboard">
      <section class="panel readout" aria-labelledby="latest-title">
        <div class="status-line">
          <span class="status" id="status" aria-live="polite">正在读取</span>
          <time id="latest-time">—</time>
        </div>
        <p class="eyebrow" id="latest-title" style="margin-top: 30px; color: rgba(255,255,255,.5)">最近一次</p>
        <div class="weight"><strong id="latest-weight">--.--</strong><span>kg</span></div>
        <div class="ruler" aria-hidden="true"></div>
        <dl class="facts">
          <div><dt>原始阻抗</dt><dd class="data" id="latest-impedance">—</dd></div>
          <div><dt>较上次</dt><dd class="data" id="latest-delta">—</dd></div>
          <div><dt>设备</dt><dd id="latest-device">—</dd></div>
        </dl>
      </section>

      <div class="right-column">
        <section class="panel" aria-labelledby="trend-title">
          <div class="panel-heading">
            <div><p class="label">Last 30 readings</p><h2 id="trend-title">体重趋势</h2></div>
            <output id="range">—</output>
          </div>
          <div class="chart-wrap">
            <svg id="chart" viewBox="0 0 720 210" role="img" aria-label="最近体重趋势"></svg>
            <p class="empty" id="chart-empty">完成第一次称重后，趋势会显示在这里。</p>
          </div>
        </section>
      </div>

      <section class="panel history" aria-labelledby="history-title">
        <div class="panel-heading">
          <div><p class="label">Measurement history</p><h2 id="history-title">原始记录</h2></div>
          <output id="total">0 条</output>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>测量时间</th><th>体重</th><th>原始阻抗</th><th>设备</th></tr></thead>
            <tbody id="history-body"></tbody>
          </table>
        </div>
      </section>
    </div>

    <footer><span>重量由设备原始克数换算</span><span id="updated">尚未刷新</span></footer>
  </main>

  <script>
    const elements = Object.fromEntries([
      "refresh", "status", "latest-time", "latest-weight", "latest-impedance",
      "latest-delta", "latest-device", "chart", "chart-empty", "range", "total",
      "history-body", "updated"
    ].map(id => [id, document.getElementById(id)]));

    const formatTime = value => new Intl.DateTimeFormat("zh-CN", {
      month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
    }).format(new Date(value));

    function renderLatest(rows) {
      if (!rows.length) return;
      const latest = rows[0];
      elements["latest-weight"].textContent = (latest.weight_g / 1000).toFixed(2);
      elements["latest-impedance"].textContent = latest.impedance_raw;
      elements["latest-device"].textContent = latest.device_id;
      elements["latest-time"].textContent = formatTime(latest.measured_at);
      if (rows.length > 1) {
        const delta = (latest.weight_g - rows[1].weight_g) / 1000;
        elements["latest-delta"].textContent = `${delta > 0 ? "+" : ""}${delta.toFixed(2)} kg`;
      }
    }

    function renderChart(rows) {
      const values = rows.slice(0, 30).reverse().map(row => row.weight_g / 1000);
      const svg = elements.chart;
      svg.replaceChildren();
      elements["chart-empty"].hidden = values.length > 0;
      if (!values.length) return;

      const width = 720, height = 210, left = 48, right = 16, top = 18, bottom = 30;
      const rawMin = Math.min(...values), rawMax = Math.max(...values);
      const padding = Math.max((rawMax - rawMin) * 0.2, 0.25);
      const min = rawMin - padding, max = rawMax + padding;
      const x = index => left + (values.length === 1 ? (width - left - right) / 2 : index * (width - left - right) / (values.length - 1));
      const y = value => top + (max - value) * (height - top - bottom) / (max - min);
      const ns = "http://www.w3.org/2000/svg";

      for (let index = 0; index < 3; index += 1) {
        const lineY = top + index * (height - top - bottom) / 2;
        const line = document.createElementNS(ns, "line");
        line.setAttribute("x1", left); line.setAttribute("x2", width - right);
        line.setAttribute("y1", lineY); line.setAttribute("y2", lineY);
        line.setAttribute("class", "grid-line");
        svg.append(line);
        const label = document.createElementNS(ns, "text");
        label.setAttribute("x", 0); label.setAttribute("y", lineY + 4); label.setAttribute("class", "grid-label");
        label.textContent = (max - index * (max - min) / 2).toFixed(1);
        svg.append(label);
      }

      const path = document.createElementNS(ns, "path");
      path.setAttribute("d", values.map((value, index) => `${index ? "L" : "M"}${x(index)},${y(value)}`).join(" "));
      path.setAttribute("class", "trend-line");
      path.setAttribute("pathLength", "1");
      svg.append(path);

      const dot = document.createElementNS(ns, "circle");
      dot.setAttribute("cx", x(values.length - 1)); dot.setAttribute("cy", y(values[values.length - 1]));
      dot.setAttribute("r", 5); dot.setAttribute("class", "trend-dot");
      svg.append(dot);
      elements.range.textContent = `${rawMin.toFixed(1)}–${rawMax.toFixed(1)} kg`;
    }

    function renderHistory(rows, total) {
      elements.total.textContent = `${total} 条`;
      const fragment = document.createDocumentFragment();
      for (const row of rows) {
        const cells = [formatTime(row.measured_at), `${(row.weight_g / 1000).toFixed(2)} kg`, row.impedance_raw, row.device_id];
        const tr = document.createElement("tr");
        cells.forEach((value, index) => {
          const td = document.createElement("td");
          td.textContent = value;
          if (index > 0) td.classList.add("data");
          if (index === 1) td.classList.add("weight-cell");
          tr.append(td);
        });
        fragment.append(tr);
      }
      elements["history-body"].replaceChildren(fragment);
    }

    async function load() {
      elements.refresh.disabled = true;
      elements.status.textContent = "正在读取";
      elements.status.classList.remove("error");
      try {
        const response = await fetch("/api/measurements?limit=365", {cache: "no-store"});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        renderLatest(data.measurements);
        renderChart(data.measurements);
        renderHistory(data.measurements, data.total);
        elements.status.textContent = data.measurements.length ? "数据已同步" : "等待第一次称重";
        elements.updated.textContent = `更新于 ${new Date().toLocaleTimeString("zh-CN", {hour: "2-digit", minute: "2-digit"})}`;
      } catch (error) {
        elements.status.textContent = "读取失败，请重试";
        elements.status.classList.add("error");
      } finally {
        elements.refresh.disabled = false;
      }
    }

    elements.refresh.addEventListener("click", load);
    load();
    setInterval(load, 30_000);
  </script>
</body>
</html>
